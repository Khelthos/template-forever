# Verification and deployment to GitHub Pages.
#
# - On every pull request: full checks, no deployment.
# - On push to the main branch: checks, build and deployment.
#   If any check fails, the site is NOT published.
#
# No secrets required. One-time setup:
# Settings → Pages → Source: "GitHub Actions".

name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Real GitHub Pages URL (https://user.github.io/repository/):
      # overrides site.url, so the base path and links are always correct.
      - name: Detect GitHub Pages URL
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Validate configuration
        run: npm run check:config

      - name: Validate content
        run: npm run check:content

      - name: Astro and TypeScript checks
        run: npm run check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url && format('{0}/', steps.pages.outputs.base_url) || '' }}

      - name: Check links and attribution in the build
        run: npm run check:links
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url && format('{0}/', steps.pages.outputs.base_url) || '' }}

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
